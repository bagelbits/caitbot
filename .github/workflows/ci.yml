name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # ruby-version: "3.3"  # Uncomment and set if you don't have a .ruby-version file
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # "lts/*" tracks the current Node LTS; consider pinning (e.g. "22") for reproducible builds.
          node-version: "lts/*"
          cache: "npm"

      - name: Install JS dependencies
        run: npm install

      - name: Set up database
        run: bin/rails db:prepare
        env:
          RAILS_ENV: test

      - name: Build JavaScript bundles
        # Shakapacker default. ViteRuby users: replace with `bin/vite build --mode test`.
        run: |
          bin/shakapacker-precompile-hook
          SHAKAPACKER_SKIP_PRECOMPILE_HOOK=true bin/shakapacker
        env:
          RAILS_ENV: test
          NODE_ENV: test

      - name: Run tests
        run: bin/rails test
        env:
          RAILS_ENV: test
