name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  semantic-pr-title:
    name: Semantic Pull Request
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
